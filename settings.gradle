pluginManagement {
    repositories {
        gradlePluginPortal()
        // ForgeGradle is published to the MinecraftForge maven, not the plugin portal.
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // MixinGradle, which wires the Mixin annotation processor up to ForgeGradle's
        // reobfuscation so the refmap maps our mapped names onto the SRG names a shipped
        // jar actually runs against.
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
